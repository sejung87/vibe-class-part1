<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*
         CSS 선택자를 생성하고, 내용을입력합니다.
         선택자에는 
         html tag (html 태그 전체 적용)
         tag id (id 를 가진 태그에 적용, id 앞에 #을 붙인다)
         className (class이름이 적용된 태그에 적용. 이름앞에 .을 붙인다 )
         tag 속성 (속성이 부합하는 태그에 적용 )
        */

        div {
            border : 1px solid black
        }
        
        
        .parent{
            height: 400px;
            background-color: yellow;
        }
        .child{
            width: 40%;
            height: 100%;
            background-color: red;
        }
    </style>
</head>
<body>
    <div class="parent">
       <div class="child">
        
       </div>
    </div> 
        
    
</body>
</html>
